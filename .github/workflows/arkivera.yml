name: Arkivera DMI WAM

on:
  schedule:
    # efter varje DMI-körning (00/06/12/18 UTC, klar ca 3 h senare) + en reservkörning
    - cron: "35 3,9,15,21 * * *"
    - cron: "5 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: arkiv
  cancel-in-progress: false

jobs:
  arkivera:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: arkiv
          fetch-depth: 1

      - name: Hämta koden från dyning
        uses: actions/checkout@v5
        with:
          repository: ZephXiro/dyning
          path: kod

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kod/requirements.txt

      - run: pip install -r kod/requirements.txt

      - name: Arkivera nya körningar
        run: python kod/archive.py --root arkiv --max-runs 8

      - name: Spara i repot
        working-directory: arkiv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Inget nytt"; exit 0; fi
          git commit -q -m "Arkiv $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q

      - name: Håll schemat aktivt (GitHub pausar annars efter 60 dagar)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/arkivera.yml/enable"
